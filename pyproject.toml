[project]
name = "homegym"
version = "2.0.0"
description = "Self hosted training log for a home gym with an AI coach"
requires-python = ">=3.12"

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["app"]
extend-exclude = ["frontend", "app/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008", "SIM108", "SIM102", "SIM105", "B904", "UP035", "C408", "UP006", "UP045", "UP017", "UP032", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = [
  "ai", "alexa", "architect", "catalog", "coach", "coach_api", "config", "cycle", "db", "deps", "engine", "exercise_notes",
  "conftest", "main", "nutrition", "onboarding", "planner", "quality", "reviewer", "routes", "schemas", "settings_api", "workers", "youtube",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:fastapi.*"]
