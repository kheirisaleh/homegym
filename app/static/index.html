<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1e22">
<title>Home Gym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='5' height='14' rx='1.5' fill='%23f2c14e'/%3E%3Crect x='25' y='9' width='5' height='14' rx='1.5' fill='%23f2c14e'/%3E%3Crect x='7' y='14' width='18' height='4' fill='%23edebe6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css?v=cycle2">
<link rel="stylesheet" href="/static/m/cycle.css?v=cycle2">
<link rel="stylesheet" href="/static/cycle-desktop.css?v=cycle2">
<script src="/static/vendor/chart.umd.min.js" defer></script>
<script type="module" src="/static/js/app.js?v=cycle2"></script>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div class="shell" id="shell" hidden>
  <aside class="rail">
    <a class="brand" href="#/" aria-label="Home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="5" height="14" rx="1.5"/><rect x="25" y="9" width="5" height="14" rx="1.5"/><rect class="bar" x="7" y="14" width="18" height="4"/></svg>
      <span>Home Gym</span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#/" data-route="dashboard"><span class="key">1</span>Overview</a>
      <a href="#/training" data-route="training"><span class="key">2</span>Training</a>
      <a href="#/programs" data-route="programs"><span class="key">3</span>Programs</a>
      <a href="#/exercises" data-route="exercises"><span class="key">4</span>Exercises</a>
      <a href="#/equipment" data-route="equipment"><span class="key">5</span>Equipment</a>
      <a href="#/history" data-route="history"><span class="key">6</span>History</a>
      <a href="#/coach" data-route="coach"><span class="key">7</span>Coach</a>
      <a href="#/leaderboard" data-route="leaderboard"><span class="key">8</span>Leaderboard</a>
      <a href="#/trainer" data-route="trainer"><span class="key">9</span>My coach</a>
      <a href="#/health" data-route="health" id="nav-health" style="display:none"><span class="key">H</span>Health</a>
      <a href="#/settings" data-route="settings" id="nav-settings" style="display:none"><span class="key">0</span>Settings</a>
    </nav>
    <div class="rail-foot">
      <a class="user-chip" id="user-chip" href="#/profile"></a>
      <div id="block-chip" class="block-chip"></div>
      <button id="projector-toggle" class="projector-toggle" type="button" aria-pressed="false" title="Projector mode (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="16" cy="12" r="3"/><path d="M6 17v2M18 17v2"/></svg>
        <span>Projector</span>
      </button>
    </div>
  </aside>
  <div class="stage">
    <div id="ai-banner" class="ai-banner" hidden></div>
    <div id="active-banner" class="active-banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
</body>
</html>
